name: Deploy MERN Application

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build backend
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/mern-backend:${{ github.sha }} \
            ./backend

      - name: Push backend
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/mern-backend:${{ github.sha }}

      - name: Build frontend
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/mern-frontend:${{ github.sha }} \
            ./frontend

      - name: Push frontend
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/mern-frontend:${{ github.sha }}