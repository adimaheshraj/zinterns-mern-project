name: Deploy MERN Application

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build backend
        run: |
          docker build -t ${{ steps.login-ecr.outputs.registry }}/mern-backend:${{ github.sha }} ./backend

      - name: Push backend
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/mern-backend:${{ github.sha }}

      - name: Build frontend
        run: |
          docker build -t ${{ steps.login-ecr.outputs.registry }}/mern-frontend:${{ github.sha }} ./frontend

      - name: Push frontend
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/mern-frontend:${{ github.sha }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo docker pull ${{ steps.login-ecr.outputs.registry }}/mern-backend:${{ github.sha }}
            sudo docker pull ${{ steps.login-ecr.outputs.registry }}/mern-frontend:${{ github.sha }}
            sudo docker stop mern-backend mern-frontend || true
            sudo docker rm mern-backend mern-frontend || true
            sudo docker run -d --name mern-backend --network mern-network -p 5000:5000 \
              ${{ steps.login-ecr.outputs.registry }}/mern-backend:${{ github.sha }}
            sudo docker run -d --name mern-frontend --network mern-network -p 80:80 \
              ${{ steps.login-ecr.outputs.registry }}/mern-frontend:${{ github.sha }}
